[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heinzy"
version = "0.1.0"
description = "Heinzy — governed advising assistant (retrieval + governance layer)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    # Ingest (M1/M3/M4): no fallback path if these are missing -- extract_pages,
    # chunk_blocks, and embed_chunks all hard-crash without them.
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "tiktoken>=0.13.0",
    # Retrieval + ingest embeddings (A2/M4). Small (~130MB), CPU-friendly, no
    # multi-GB download -- replaced sentence-transformers so query vectors and
    # stored vectors are guaranteed to come from the same library/model.
    "fastembed>=0.8.0",
    # Generation (Ollama or Azure OpenAI / AI Foundry HTTP APIs).
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Shared Chroma HTTP thin client (S4). Avoids native hnswlib builds on Windows.
# Server runs via docker-compose.chroma.yml — do not also install full `chromadb`.
# Pin major with the Docker image tag in docker-compose.chroma.yml.
store = [
    "chromadb-client>=1.5.0,<2",
]
dev = [
    "pytest>=8.0.0",
]
# Browser chat UI (heinzy/webui). Install when running python -m heinzy.webui.app
# or docker-compose.webui.yml.
webui = [
    "flask>=3.0,<4",
]
# Policy-engine backend for Layer 1 abstention (#11). Optional on purpose: the
# builtin engine keeps a plain install working, and this pulls a sizeable
# dependency tree that most of the team does not need locally.
governance = [
    "agent-governance-toolkit[core]>=4.0.0,<5",
]

[tool.setuptools.packages.find]
include = ["heinzy*"]

[tool.pytest.ini_options]
markers = [
    "integration: needs live shared infra (Chroma/Ollama)",
]
