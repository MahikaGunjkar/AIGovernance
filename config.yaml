# Heinzy — single versioned config (Infra task S5)
# Rule: NO tunable constants in source. Everything that changes retrieval or
# model behavior lives here. The sha256 of this file is written into every
# eval result so any run is reproducible.

version: "0.1.0"

# ---- Chunking (ingest M3) --------------------------------------------------
chunk:
  target_tokens: 512      # tune me — see PRD Note on Context Entity Recall
  overlap_tokens: 64

# ---- Embedding (ingest M4 + retrieval) -------------------------------------
# Local, open-weight embedder so nothing leaves local infra (PRD Data/Compute
# constraint). NOTE: this is the *retrieval* embedder, distinct from the
# generation model (Gemma) below — Gemma does not produce embeddings.
embed:
  model_tag: "BAAI/bge-small-en-v1.5"
  dimension: 384

# ---- Retrieval (A2) --------------------------------------------------------
retrieval:
  k: 5                    # top-k chunks returned; read from config, never hardcoded
  # Layer 1 of abstention. Hits below this cosine similarity are dropped
  # BEFORE generation. If nothing survives, the model is never called and the
  # system refuses. 0.0 disables the gate (every question gets context, so the
  # only thing preventing a plausible-sounding answer is the prompt).
  # Calibrate with: python scripts/calibrate_floor.py
  #
  # 0.75 sits inside the separating window measured on the real handbook, where
  # the lowest in-corpus question scores 0.7698 and the highest out-of-corpus
  # one scores 0.7449. That window is only 0.0249 wide, so this is a real gate
  # rather than a comfortable one. A legitimate question that happens to score
  # 0.74 will be refused. Re-run the calibration after any change to chunking,
  # k, or the embedding model, and widen the question set before trusting the
  # margin further.
  score_floor: 0.75

# ---- Vector store (S4) -----------------------------------------------------
# Accessed only through the VectorStore protocol in heinzy/retrieval/store.py
# so the store swaps without touching retrieval. Default "memory" keeps clone
# + tests offline. Team shared DB: run docker-compose.chroma.yml on the host,
# set backend to "chroma", and point CHROMA_HOST at that machine (Mac/Windows).
vector_store:
  backend: "chroma"       # memory | chroma
  persist_dir: "data/index"   # reserved for local adapters; unused by HTTP chroma
  host: "${CHROMA_HOST}"      # 127.0.0.1 on host operator; LAN IP for teammates
  port: 8000
  collection: "heinzy"

# ---- Generation model (S3) -------------------------------------------------
# Recorded for reproducibility + stamped into eval output. The model is served
# on the shared Colab Ollama host (notebooks/colab_gemma_ollama_host.ipynb);
# teammates only set MODEL_ENDPOINT (ephemeral ngrok HTTPS URL). Retrieval does
# not call this. Optional LAN fallback: docker-compose.ollama.yml.
# on the shared Ollama host; teammates only set MODEL_ENDPOINT. Retrieval does
# not call this.
model:
  tag: "gemma3:12b"           # Ollama tag; with Azure, override via AZURE_OPENAI_DEPLOYMENT / MODEL_TAG
  quantization: "Q4_K_M"      # Ollama default quant for these tags (ignored for azure_openai)
  endpoint: "${MODEL_ENDPOINT}"   # Ollama only; Azure uses AZURE_OPENAI_ENDPOINT
  # Provider is env-only (MODEL_PROVIDER=ollama|azure_openai) so secrets stay out of this file.

# ---- Grounded answering / abstention -----------------------------------------
# "Answer only from retrieved chunks, otherwise say you can't." Two layers:
#   1. retrieval.score_floor above. Nothing relevant was retrieved, so refuse
#      without calling the model at all. Deterministic, cannot be talked out of.
#   2. sentinel below. Context passed the floor but does not actually contain
#      the answer, so the model itself signals the gap in a checkable way.
generation:
  # Layer 1 of abstention is evaluated by a policy engine rather than by an
  # inline condition, so the decision can be audited alongside every other
  # governed action (#11).
  #   builtin  deterministic count check, no extra dependency, always available
  #   agt      Microsoft Agent Governance Toolkit, registers the same condition
  #            as a PolicyRule and records allow/deny in the kernel audit log.
  #            Needs `pip install -e ".[governance]"`.
  # Requesting agt without the extra installed DENIES rather than falling back
  # to builtin. A safety gate that silently downgrades when its dependency is
  # missing still looks governed while enforcing nothing.
  policy:
    engine: "builtin"
    agent_id: "heinzy-advisor"

  # Sampling. Ollama defaults to temperature 0.8, which made the same question
  # refuse on one run and answer on the next, and made the config_hash stamped
  # into every eval result a promise the system could not keep. A governed
  # assistant that answers differently on a re-ask cannot be audited, and an
  # eval that does not reproduce is not evidence.
  temperature: 0.0
  seed: 0
  abstain:
    # Exact token the model is told to emit when the excerpts don't answer the
    # question. Detected case-insensitively; the user never sees it.
    sentinel: "INSUFFICIENT_CONTEXT"
    # Fewer surviving hits than this -> refuse without calling the model.
    min_hits: 1
    # What the advisor actually sees on a refusal. Deterministic, so downstream
    # (eval, event log, UI) can rely on it instead of parsing model prose.
    refusal_text: >-
      I can't answer that from the MISM handbook. The handbook sections I can
      search don't contain the information needed to answer this question.
      Please check with Heinz College advising staff directly.
  citations:
    # Sections cited in the answer must appear in the retrieved set. Violations
    # are recorded on the Answer as unsupported_citations rather than raising.
    # The eval harness is what turns them into a failure.
    require: true

# ---- Prompt versioning -----------------------------------------------------
prompt:
  version: "p0"

# ---- Governance (PEP mount from feature/governance-policies) ---------------
# Runtime mount only — do not vendor that branch here. When GOVERNANCE_SRC is
# set (see docker-compose.heinzy.yml), Generator enters the tool loop and every
# tool call is gated by OllamaGovernanceInterceptor.
governance:
  enabled: true              # ignored unless GOVERNANCE_SRC mount is present
  agent_id: "heinzy-advisor"
  max_tool_rounds: 3
  version: "p1"           # p1 = grounded/abstention prompt
