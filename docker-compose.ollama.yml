# Optional LAN Gemma/Ollama host (Infra task S3 fallback).
#
# Primary shared host is Google Colab + ngrok (issue #16):
#   notebooks/colab_gemma_ollama_host.ipynb  →  gemma2:12b
#   docs/colab_gemma_host.md
#
# Use this compose file only for a persistent local/LAN GPU box. Teammates then
# set MODEL_ENDPOINT=http://<this-host>:11434 (not the Colab HTTPS URL).
#
# Operator (on the LAN host):
#   docker compose -f docker-compose.ollama.yml up -d
#   docker compose -f docker-compose.ollama.yml exec ollama ollama pull gemma2:12b
#
# Smoke from another machine:
#   curl http://<host>:11434/api/tags
#
# GPU: requires NVIDIA drivers + Docker GPU support. If the host has no GPU,
# delete the `gpus:` line; Ollama will run on CPU (much slower).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: heinzy-ollama
    ports:
      - "11434:11434"
    environment:
      # Bind all interfaces so LAN / VPN teammates can connect.
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    gpus: all

volumes:
  ollama_data:
