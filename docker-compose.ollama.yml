# Optional local/LAN Ollama host.
#
# Prefer Azure AI Foundry for shared generation on CPU-only machines
# (see azurereadme.md and README.md). Use this compose file when you have a
# GPU box and want MODEL_PROVIDER=ollama.
#
# Operator:
#   docker compose -f docker-compose.ollama.yml up -d
#   docker compose -f docker-compose.ollama.yml exec ollama ollama pull gemma3:12b
#
# Clients:
#   MODEL_PROVIDER=ollama
#   MODEL_ENDPOINT=http://<this-host>:11434
#
# GPU: requires NVIDIA drivers + Docker GPU support. If the host has no GPU,
# delete the `gpus:` line; Ollama will run on CPU (much slower).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: heinzy-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    gpus: all

volumes:
  ollama_data:
