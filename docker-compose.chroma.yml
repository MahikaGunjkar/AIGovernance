# Shared Chroma vector DB (Infra task S4).
#
# Run this on ONE machine (same host as Ollama is fine). Teammates do NOT run
# this — they set CHROMA_HOST in .env to this machine's LAN/VPN IP and
# vector_store.backend: chroma in config.yaml.
#
# Works on Windows and Mac Docker Desktop (CPU only; no GPU flags).
#
# Operator:
#   docker compose -f docker-compose.chroma.yml up -d
#   # Firewall (Windows host): allow inbound TCP 8000 on Private/Domain
#
# Smoke from any teammate machine:
#   curl http://<host>:8000/api/v2/heartbeat
#
# Heinzy clients:
#   pip install -e ".[store]"
#   CHROMA_HOST=<host-ip>  (port defaults to 8000)

services:
  chroma:
    image: chromadb/chroma:1.5.3
    container_name: heinzy-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

volumes:
  chroma_data:
