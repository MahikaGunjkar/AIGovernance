<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heinzy — Advisor RAG Chat</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --ink: #1a1a1a; --muted: #6b7280;
    --line: #e5e7eb; --user: #2563eb; --bot: #111827;
    --decline-bg: #fff7ed; --decline-line: #f59e0b; --decline-ink: #92400e;
    --src-bg: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  header button {
    font-size: 12px; padding: 6px 12px; border: 1px solid var(--line);
    background: var(--panel); border-radius: 6px; cursor: pointer; color: var(--muted);
  }
  header button:hover { background: var(--bg); }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 820px;
    width: 100%; margin: 0 auto;
  }
  .turn { margin-bottom: 20px; }
  .bubble {
    padding: 12px 16px; border-radius: 12px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .q .bubble {
    background: var(--user); color: white; margin-left: auto; max-width: 78%;
    border-bottom-right-radius: 3px;
  }
  .q { display: flex; margin-bottom: 6px; }
  .a .bubble {
    background: var(--panel); border: 1px solid var(--line); max-width: 88%;
    border-bottom-left-radius: 3px;
  }
  /* Declined answers look visibly different (ticket #17) */
  .a.declined .bubble {
    background: var(--decline-bg); border-color: var(--decline-line); color: var(--decline-ink);
  }
  .a .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-bottom: 4px; font-weight: 600;
  }
  .a.declined .label { color: var(--decline-line); }
  .sources {
    margin-top: 8px; background: var(--src-bg); border-radius: 8px;
    padding: 8px 12px; font-size: 12px;
  }
  .sources h4 { margin: 0 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .src-item { padding: 3px 0; color: #374151; display: flex; justify-content: space-between; gap: 12px; }
  .src-item .sec { font-weight: 500; }
  .src-item .meta { color: var(--muted); white-space: nowrap; }
  .no-sources { color: var(--muted); font-style: italic; }
  footer {
    background: var(--panel); border-top: 1px solid var(--line); padding: 14px 20px;
  }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
  #q {
    flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-family: inherit; resize: none;
  }
  #send {
    padding: 0 20px; background: var(--user); color: white; border: none;
    border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  #send:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 14px; }
  .thinking { color: var(--muted); font-size: 13px; padding: 4px 16px; }
</style>
</head>
<body>
  <header>
    <h1>Heinzy — Advisor RAG Chat</h1>
    <span class="status" id="status">connecting…</span>
    <button id="clear">Clear history</button>
  </header>

  <div id="chat">
    <div class="empty" id="empty">Ask a question about the MISM handbook to begin.</div>
  </div>

  <footer>
    <div class="composer">
      <textarea id="q" rows="1" placeholder="Ask about the MISM handbook…"></textarea>
      <button id="send">Send</button>
    </div>
  </footer>

<script>
const STORAGE_KEY = "heinzy_chat_history_v1";
const chat = document.getElementById("chat");
const empty = document.getElementById("empty");
const qBox = document.getElementById("q");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

// ---- history (ticket #18: browser localStorage persistence) ----
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch { return []; }
}
function saveHistory(hist) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(hist));
}
let history = loadHistory();

function escapeHtml(s) {
  const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML;
}

function renderTurn(turn) {
  empty.style.display = "none";
  const wrap = document.createElement("div");
  wrap.className = "turn";

  const q = document.createElement("div");
  q.className = "q";
  q.innerHTML = `<div class="bubble">${escapeHtml(turn.question)}</div>`;
  wrap.appendChild(q);

  const a = document.createElement("div");
  a.className = "a" + (turn.declined ? " declined" : "");
  let srcHtml = "";
  if (turn.sources && turn.sources.length) {
    srcHtml = `<div class="sources"><h4>Sources</h4>` +
      turn.sources.map(s =>
        `<div class="src-item"><span class="sec">${escapeHtml(s.section_path || "—")}</span>` +
        `<span class="meta">p${JSON.stringify(s.source_pages)} · score ${s.score}</span></div>`
      ).join("") + `</div>`;
  } else {
    srcHtml = `<div class="sources no-sources">No sources returned.</div>`;
  }
  a.innerHTML =
    `<div class="label">${turn.declined ? "Heinzy · declined" : "Heinzy"}</div>` +
    `<div class="bubble">${escapeHtml(turn.answer)}</div>` + srcHtml;
  wrap.appendChild(a);

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

// restore prior session on load (ticket #18)
history.forEach(renderTurn);

async function checkHealth() {
  try {
    const r = await fetch("/api/health");
    const h = await r.json();
    statusEl.textContent = h.ready
      ? `model ${h.model_tag} · ${h.chunks_indexed} chunks`
      : "warming up (first question builds the index)…";
  } catch { statusEl.textContent = "offline"; }
}
checkHealth();

async function ask() {
  const question = qBox.value.trim();
  if (!question) return;
  qBox.value = "";
  sendBtn.disabled = true;

  const thinking = document.createElement("div");
  thinking.className = "thinking";
  thinking.textContent = "searching handbook and generating answer…";
  chat.appendChild(thinking);
  chat.scrollTop = chat.scrollHeight;

  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    thinking.remove();
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.error || `server error ${r.status}`);
    }
    const data = await r.json();
    const turn = {
      question,
      answer: data.answer,
      declined: data.declined,
      sources: data.sources,
      ts: Date.now(),
    };
    history.push(turn);
    saveHistory(history);
    renderTurn(turn);
    checkHealth();
  } catch (err) {
    thinking.remove();
    const turn = {
      question,
      answer: "Error: " + err.message,
      declined: true,
      sources: [],
      ts: Date.now(),
    };
    history.push(turn);
    saveHistory(history);
    renderTurn(turn);
  } finally {
    sendBtn.disabled = false;
    qBox.focus();
  }
}

sendBtn.addEventListener("click", ask);
qBox.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
document.getElementById("clear").addEventListener("click", () => {
  history = [];
  saveHistory(history);
  chat.querySelectorAll(".turn").forEach(n => n.remove());
  empty.style.display = "block";
});
</script>
</body>
</html>
